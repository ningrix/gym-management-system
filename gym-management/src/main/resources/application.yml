server:
  port: 8080
  # exercises.json 17MB，开启 gzip 后约 2MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain,image/svg+xml
    min-response-size: 2048
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: gym-management
  # 默认使用 H2 内存库（MySQL 兼容模式），便于免安装演示
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:gym;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai
  web:
    resources:
      cache:
        period: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

logging:
  level:
    root: info
    com.ncu.gym: info

# 动作库（外置静态模块）：目录可用环境变量 GYM_EXERCISES_DIR 覆盖
gym:
  exercises:
    dir: ${GYM_EXERCISES_DIR:file:./exercises-dataset/}

