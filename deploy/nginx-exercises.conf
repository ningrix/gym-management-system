# 动作库（exercises-dataset）Nginx 反向代理示例
# 说明：本系统默认由 Spring Boot 内置静态目录提供 /exercises/；
#      若前置 Nginx，可用下面的 location 直接由 Nginx 托管，减轻应用压力。
# 注意：alias 与 location 末尾都必须带 /，否则会拼接出错导致 404。

location /exercises/ {
    # 换成实际外置目录的绝对路径
    alias /data/exercises-dataset/;
    index index.html;
    try_files $uri $uri/ /exercises/index.html;

    # 页面：短缓存，更新后尽快生效
    location = /exercises/index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 数据：1 小时
    location ~* ^/exercises/data/.*\.json$ {
        expires 1h;
        add_header Cache-Control "public";
        gzip on;
        gzip_types application/json;
    }

    # 媒体：7 天（文件名带哈希，可安全长缓存）
    location ~* ^/exercises/(images|videos)/.*\.(gif|png|jpe?g|webp|mp4)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
}

# 若会员系统本身部署在 /gym/ 子路径，把上面 location 改成 /gym/exercises/
# 并确保 alias 指向同一目录，页面内资源均为相对路径，无需改代码。
