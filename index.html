:root {
  --bg: #000000;
  --text: #ffffff;
  --muted: #8e8e8e;
  --nav-text: #2e2e2e;
  --pill-dark: #28282a;
  --sign-in-text: #c8c8c8;
  --nav-shadow: 0 4px 14px rgba(0, 0, 0, 0.16);
  --trust-bg: #28282a;
  --trust-border: rgba(255, 255, 255, 0.4);
  --trust-text: #c4c2c3;
  --brand: #1e6fff;
  --brand-dark: #1859cc;
  --accent: #17c3a2;
  --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-display: "BubbledotICG-FinePos", "Geist Pixel Circle", monospace;
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

a { color: inherit; }

[hidden] { display: none !important; }

.bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  background: #000000;
  z-index: 0;
}

.bg-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
  z-index: 0;
}

.page {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  padding: clamp(16px, 2.4vh, 28px) clamp(14px, 3vw, 32px);
}

/* ---------- 1. Header ---------- */

.site-header {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 2.8vw, 28px);
  width: 100%;
  max-width: 720px;
  animation: slideDown 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.logo {
  display: grid;
  place-items: center;
  width: clamp(40px, 4.4vw, 46px);
  height: clamp(40px, 4.4vw, 46px);
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--nav-shadow);
  transition: transform 0.25s ease;
}

.logo:hover { transform: scale(1.04); }

.logo img {
  display: block;
  width: 72%;
  height: 72%;
  object-fit: contain;
}

.nav-pill {
  display: flex;
  align-items: center;
  flex: 1;
  max-width: 430px;
  height: clamp(44px, 5.2vw, 48px);
  padding: 4px 8px;
  border-radius: 999px;
  background: #fff;
  box-shadow: var(--nav-shadow);
}

.nav-link {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  height: 100%;
  padding: 0 10px;
  font-family: var(--font-sans);
  font-size: clamp(13px, 1.4vw, 15px);
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--nav-text);
  text-decoration: none;
  white-space: nowrap;
  opacity: 0.5;
  transition: opacity 0.2s ease;
}

.nav-link:hover { opacity: 0.75; }
.nav-link.active { opacity: 1; }

.nav-link.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 5px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #111;
  transform: translateX(-50%);
  box-shadow: -5px 0 0 #111, 5px 0 0 #111;
}

.sign-in {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: clamp(44px, 5.2vw, 48px);
  padding: 0 clamp(20px, 2.5vw, 28px);
  border-radius: 999px;
  background: var(--brand);
  color: #ffffff;
  font-family: var(--font-sans);
  font-size: clamp(13px, 1.4vw, 15px);
  font-weight: 500;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: var(--nav-shadow);
  transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
}

.sign-in:hover {
  background: var(--brand-dark);
  color: #ffffff;
  transform: translateY(-1px);
}

.menu-toggle { display: none; }

/* ---------- 2. Hero ---------- */

.hero {
  position: relative;
  z-index: 1;
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 22px 0;
  text-align: center;
}

.hero-content {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  transform-origin: center center;
}

.trust {
  --trust-size: clamp(36px, 4.5vw, 42px);
  display: inline-flex;
  align-items: center;
  margin-bottom: clamp(16px, 2.5vh, 26px);
}

.trust-avatar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: var(--trust-size);
  height: var(--trust-size);
  padding: 5px;
  border-radius: 50%;
  background: var(--trust-bg);
  border: 1px solid var(--trust-border);
  transition: transform 0.35s ease;
}

.trust-avatar:nth-child(1) { z-index: 1; }
.trust-avatar:nth-child(2) { z-index: 2; margin-left: calc(var(--trust-size) * -0.42); }
.trust-avatar:nth-child(3) { z-index: 4; margin-left: calc(var(--trust-size) * -0.42); }

.trust-avatar:nth-child(1):hover { transform: translateY(-2px); }
.trust-avatar:nth-child(2):hover { transform: translateY(-4px); }
.trust-avatar:nth-child(3):hover { transform: translateY(-2px); }

.trust-inner {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: #fff;
}

.trust-inner i {
  color: #111;
  font-size: calc(var(--trust-size) * 0.34);
  line-height: 1;
}

.trust-pill {
  position: relative;
  z-index: 3;
  display: inline-flex;
  align-items: center;
  height: var(--trust-size);
  margin-left: calc(var(--trust-size) * -0.42);
  padding-left: calc(var(--trust-size) * 0.58);
  padding-right: 15px;
  border-radius: 999px;
  background: var(--trust-bg);
  border: 1px solid var(--trust-border);
  color: var(--trust-text);
  font-family: var(--font-sans);
  font-size: clamp(12px, 1.4vw, 13.5px);
  font-weight: 500;
  white-space: nowrap;
}

.headline {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(28px, 6.2vw, 80px);
  font-weight: 400;
  line-height: 1.12;
  letter-spacing: -0.04em;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-align: center;
}

.headline-line {
  display: block;
  animation: headlineFade 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
  animation-delay: var(--d, 0s);
}

.headline.anim {
  animation: none;
  opacity: 1;
  transform: none;
  filter: none;
}

.dot-letter {
  position: relative;
  display: inline-block;
}

.dot-source { opacity: 0; }

.dot-glyph {
  position: absolute;
  left: 0;
  top: 50%;
  width: 1em;
  height: 1em;
  transform: translateY(-50%);
  pointer-events: none;
}

.subtitle {
  margin: clamp(16px, 2.6vh, 26px) 0 0;
  max-width: min(500px, 92%);
  color: #d0d0d0;
  font-family: var(--font-sans);
  font-size: clamp(calc(13.5px + 2pt), calc(1.55vw + 2pt), calc(16.5px + 2pt));
  font-weight: 400;
  line-height: 1.55;
  text-wrap: balance;
  opacity: 0.8;
  --reveal-end-opacity: 0.8;
}

.cta {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: clamp(20px, 3.3vh, 32px);
  padding: clamp(11px, 1.6vh, 13px) clamp(22px, 3vw, 28px);
  border-radius: 999px;
  background: #ffffff;
  color: #000000;
  font-family: var(--font-sans);
  font-size: clamp(13.5px, 1.5vw, 14.5px);
  font-weight: 600;
  line-height: 1.5;
  text-decoration: none;
  white-space: nowrap;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.15), 0 0 22px rgba(255, 255, 255, 0.32), 0 0 44px rgba(255, 255, 255, 0.12);
  transition: transform 0.28s ease, box-shadow 0.28s ease;
}

.cta.anim {
  animation: revealPulse 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
  animation-delay: var(--d, 0.4s);
}

.cta.pulse-done {
  animation: none;
  opacity: 1;
  transform: none;
  filter: none;
}

.cta:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 30px rgba(255, 255, 255, 0.45), 0 0 60px rgba(255, 255, 255, 0.2);
}

/* ---------- 3. Stats ---------- */

.stats {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: clamp(16px, 3vw, 36px);
  width: 100%;
  max-width: 920px;
  padding-bottom: clamp(4px, 0.9vh, 10px);
}

.stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}

.stat-icon {
  font-size: clamp(22px, 3vw, 33px);
  line-height: 1;
  color: #ffffff;
}

.stat-value {
  font-family: var(--font-sans);
  font-size: clamp(18px, 2.2vw, 26px);
  font-weight: 500;
  letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  color: #ffffff;
  white-space: nowrap;
}

.stat-label {
  font-family: var(--font-sans);
  font-size: clamp(11px, 1.2vw, 12.5px);
  color: var(--muted);
}

.stat-prefix {
  font-family: var(--font-sans);
  font-size: 0.78em;
  font-weight: 500;
  margin-right: 1px;
}

.stats-live {
  position: relative;
  z-index: 1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  margin-top: 8px;
  font-family: var(--font-sans);
  font-size: 11.5px;
  color: #8e8e8e;
  letter-spacing: 0.02em;
}

.stats-live .live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px rgba(23, 195, 162, 0.85);
}

.stats-live.is-offline .live-dot {
  background: #8e8e8e;
  box-shadow: none;
}

/* ---------- 4. Mobile menu ---------- */

.menu-layer {
  position: fixed;
  inset: 0;
  z-index: 1;
}

.menu-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.62);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  animation: overlayIn 0.28s ease both;
}

.menu-panel {
  position: absolute;
  top: calc(clamp(16px, 2.4vh, 28px) + 48px + 14px);
  left: 0;
  right: 0;
  width: min(420px, calc(100% - 28px));
  margin: 0 auto;
  padding: 22px 18px 20px;
  border-radius: 28px;
  background: #ffffff;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  max-height: calc(100dvh - 106px);
  overflow: auto;
  animation: menuIn 0.38s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.menu-panel > * {
  animation: linkIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.menu-panel > :nth-child(1) { animation-delay: 0.06s; }
.menu-panel > :nth-child(2) { animation-delay: 0.10s; }
.menu-panel > :nth-child(3) { animation-delay: 0.14s; }
.menu-panel > :nth-child(4) { animation-delay: 0.18s; }
.menu-panel > :nth-child(5) { animation-delay: 0.22s; }

.menu-link {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 49px;
  border-radius: 14px;
  font-family: var(--font-sans);
  font-size: 16px;
  font-weight: 500;
  color: var(--nav-text);
  text-decoration: none;
}

.menu-link.active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 8px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #111;
  transform: translateX(-50%);
  box-shadow: -5px 0 0 #111, 5px 0 0 #111;
}

.menu-signin {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 49px;
  margin-top: 12px;
  border-radius: 999px;
  background: var(--brand);
  color: #ffffff;
  font-family: var(--font-sans);
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
}

.menu-signin:hover { background: var(--brand-dark); }

/* ---------- Shared entrance animation ---------- */

.anim {
  opacity: 0;
  transform: translateY(22px) scale(0.98);
  filter: blur(6px);
  animation: reveal 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: var(--d, 0s);
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-18px); }
  to { opacity: 1; transform: none; }
}

@keyframes headlineFade {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

@keyframes reveal {
  from { opacity: 0; transform: translateY(22px) scale(0.98); filter: blur(6px); }
  to { opacity: var(--reveal-end-opacity, 1); transform: none; filter: none; }
}

@keyframes revealPulse {
  0% { opacity: 0; transform: translateY(22px) scale(0.98); filter: blur(6px); }
  68% { opacity: 1; transform: translateY(-1px) scale(1.025); filter: blur(0); }
  100% { opacity: 1; transform: none; filter: none; }
}

@keyframes overlayIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes menuIn {
  from { opacity: 0; transform: translateY(-10px) scale(0.99); }
  to { opacity: 1; transform: none; }
}

@keyframes linkIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* ---------- Breakpoints ---------- */

@media (max-width: 720px) {
  .nav-pill,
  .sign-in { display: none; }

  .site-header { justify-content: space-between; }

  .logo { width: 48px; height: 48px; }

  .menu-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #28282a;
    cursor: pointer;
    transition: background 0.25s ease;
  }

  .menu-toggle[aria-expanded="true"] { background: #ffffff; }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 18px;
  }

  .bars span {
    display: block;
    width: 18px;
    height: 1.5px;
    border-radius: 2px;
    background: #ffffff;
    transition: transform 0.3s ease, background 0.25s ease, opacity 0.2s ease;
  }

  .menu-toggle[aria-expanded="true"] .bars span { background: #111111; }
  .menu-toggle[aria-expanded="true"] .bars span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
  .menu-toggle[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
  .menu-toggle[aria-expanded="true"] .bars span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

  .hero { padding: 20px 0; }
  .headline { letter-spacing: -0.08em; line-height: 1.05; }

  .stats {
    grid-template-columns: repeat(2, 1fr);
    max-width: 480px;
    gap: 22px 16px;
    padding-bottom: 4px;
  }

  .stat { gap: 6px; }

  .stats-live { font-size: 11px; margin-top: 6px; }
}

@media (max-width: 420px) {
  .trust { --trust-size: 34px; }

  .trust-pill {
    padding-right: 12px;
    font-size: 12px;
  }

  .headline {
    letter-spacing: -0.09em;
    line-height: 1.04;
  }
}

@media (max-height: 700px) {
  .hero { padding: 12px 0; }
  .trust { margin-bottom: 14px; }
  .subtitle { margin-top: 14px; }
  .cta { margin-top: 18px; }
  .stats { padding-bottom: 0; }
  .stat { gap: 5px; }
}

@media (max-width: 720px) and (max-height: 600px) {
  .hero { padding: 8px 0; }
  .trust { margin-bottom: 10px; }
  .subtitle { margin-top: 10px; }
  .cta { margin-top: 12px; }
  .stats { row-gap: 12px; }
  .stat { gap: 4px; }
}

body.menu-open .hero,
body.menu-open .stats { z-index: 0; }

body.menu-open .site-header { animation: none; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;

  .anim {
    opacity: 1 !important;
    transform: none !important;

  .headline.anim {
    opacity: 1 !important;
    transform: none !important;
    filter: none !important;
  }

  .headline-line { opacity: 1 !important; transform: none !important; }

  .subtitle { opacity: 0.8 !important; }
}

  <div class="stats-live anim" style="--d: 0.82s" role="status" aria-live="polite">
    <span class="live-dot" aria-hidden="true"></span><span class="live-text">正在连接系统…</span>
  </div>
</div>
<script>
(function () {
  'use strict';

  var hero = document.querySelector('.hero');
  var heroContent = document.querySelector('.hero-content');
  var stats = document.querySelector('.stats');
  var nums = Array.prototype.slice.call(document.querySelectorAll('.stat-num'));
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var mobileQuery = window.matchMedia('(max-width: 720px)');
  var cta = document.querySelector('.cta');

  /* ---------- System data & count-up ---------- */

  var systemBase = location.protocol === 'file:' ? 'http://localhost:8080' : '';

  (function rewriteSystemLinks() {
    if (!systemBase) {
      return;
    }
    var links = document.querySelectorAll('a[href^="/"]');
    Array.prototype.forEach.call(links, function (link) {
      link.setAttribute('href', systemBase + link.getAttribute('href'));
    });
  })();

  var countStarted = false;
  var pendingCount = false;
  var dataReady = false;

  function formatValue(value, decimals, format) {
    if (format === 'money') {
      return Math.round(value).toLocaleString('en-US');
    }
    return value.toFixed(decimals);
  }

  function setFinalNumbers() {
    nums.forEach(function (node) {
      var target = Number(node.getAttribute('data-target'));
      var decimals = Number(node.getAttribute('data-decimals'));
      node.textContent = formatValue(target, decimals, node.getAttribute('data-format'));
    });
  }

  function setZeroNumbers() {
    nums.forEach(function (node) {
      var decimals = Number(node.getAttribute('data-decimals'));
      node.textContent = formatValue(0, decimals, node.getAttribute('data-format'));
    });
  }

  function runCountUp() {
    nums.forEach(function (node, index) {
      var decimals = Number(node.getAttribute('data-decimals'));
      var format = node.getAttribute('data-format');
      var duration = 1500 + index * 80;
      var delay = 480 + index * 90;
      window.setTimeout(function () {
        var target = Number(node.getAttribute('data-target'));
        var start = performance.now();
        function frame(now) {
          var progress = Math.min(1, (now - start) / duration);
          var eased = 1 - Math.pow(1 - progress, 3);
          if (progress < 1) {
            node.textContent = formatValue(target * eased, decimals, format);
            window.requestAnimationFrame(frame);
          } else {
            node.textContent = formatValue(target, decimals, format);
          }
        }
        window.requestAnimationFrame(frame);
      }, delay);
    });
  }

  function maybeStartCountUp() {
    if (!pendingCount || !dataReady || countStarted) {
      return;
    }
    countStarted = true;
    if (reduceMotion.matches) {
      setFinalNumbers();
    } else {
      runCountUp();
    }
  }

  if (nums.length) {
    if (reduceMotion.matches) {
      setFinalNumbers();
    } else {
      setZeroNumbers();
      var startObserving = function () {
        if (!('IntersectionObserver' in window)) {
          pendingCount = true;
          dataReady = true;
          maybeStartCountUp();
          return;
        }
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (!entry.isIntersecting || entry.intersectionRatio < 0.25 || pendingCount) {
              return;
            }
            pendingCount = true;
            observer.disconnect();
            maybeStartCountUp();
          });
        }, { threshold: [0.25] });
        observer.observe(stats);
      };
      startObserving();
      window.setTimeout(function () {
        if (!dataReady) {
          dataReady = true;
          maybeStartCountUp();
        }
      }, 1200);
    }
  }

  /* ---------- Live data from the system API ---------- */

  var liveBox = document.querySelector('.stats-live');
  var liveText = liveBox ? liveBox.querySelector('.live-text') : null;

  function setLiveState(online) {
    if (!liveBox) {
      return;
    }
    liveBox.classList.toggle('is-offline', !online);
    if (liveText) {
      liveText.textContent = online ? '系统在线 · 数据实时同步' : '演示数据 · 系统服务未连接';
    }
  }

  function applySummary(data) {
    if (!data) {
      return;
    }
    var values = [data.members, data.courses, data.reservations, data.monthRevenue];
    nums.forEach(function (node, index) {
      var value = Number(values[index]);
      if (!isFinite(value)) {
        return;
      }
      node.setAttribute('data-target', String(value));
      if (countStarted || reduceMotion.matches) {
        var decimals = Number(node.getAttribute('data-decimals'));
        node.textContent = formatValue(value, decimals, node.getAttribute('data-format'));
      }
    });
  }

  function finishData(online) {
    dataReady = true;
    maybeStartCountUp();
    setLiveState(online);
  }

  if (window.fetch) {
    window.fetch(systemBase + '/api/public/summary', {
      headers: { 'Accept': 'application/json' },
      cache: 'no-store'
    }).then(function (response) {
      return response.json();
    }).then(function (result) {
      if (result && result.code === 200 && result.data) {
        applySummary(result.data);
        finishData(true);
      } else {
        finishData(false);
      }
    }).catch(function () {
      finishData(false);
    });
  } else {
    finishData(false);
  }

  /* ---------- Hero content fit (very short viewports) ---------- */

  function fitHeroContent() {
    if (!hero || !heroContent) {
      return;
    }
    var styles = window.getComputedStyle(hero);
    var paddingTop = parseFloat(styles.paddingTop) || 0;
    var paddingBottom = parseFloat(styles.paddingBottom) || 0;
    var available = hero.clientHeight - paddingTop - paddingBottom;
    var natural = heroContent.offsetHeight;
    var scale = Math.min(1, Math.max(0, available) / Math.max(1, natural));
    heroContent.style.transform = scale < 1 ? 'scale(' + scale.toFixed(4) + ')' : '';
  }

  var fitScheduled = false;
  function scheduleFit() {
    if (fitScheduled) {
      return;
    }
    fitScheduled = true;
    window.requestAnimationFrame(function () {
      fitScheduled = false;
      fitHeroContent();
    });
  }

  fitHeroContent();
  if ('ResizeObserver' in window) {
    var resizeObserver = new ResizeObserver(scheduleFit);
    if (hero) {
      resizeObserver.observe(hero);
    }
    if (heroContent) {
      resizeObserver.observe(heroContent);
    }
  }
  window.addEventListener('resize', scheduleFit);
  window.addEventListener('load', scheduleFit);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(scheduleFit);
  }

  /* ---------- CTA: release animation transform after entrance ---------- */

  if (cta) {
    cta.addEventListener('animationend', function (event) {
      if (event.animationName === 'revealPulse') {
        cta.classList.add('pulse-done');
      }
    });
  }

  /* ---------- Mobile menu ---------- */

  var toggle = document.getElementById('menuToggle');
  var layer = document.getElementById('menuLayer');
  var panel = layer ? layer.querySelector('.menu-panel') : null;
  var overlay = layer ? layer.querySelector('.menu-overlay') : null;
  var backgroundEls = [hero, stats];
  var menuOpen = false;
  var lastFocused = null;

  function menuFocusables() {
    var items = [toggle];
    var nodes = panel.querySelectorAll('a[href], button:not([disabled])');
    Array.prototype.forEach.call(nodes, function (node) {
      items.push(node);
    });
    return items;
  }

  function openMenu() {
    if (!layer || !toggle || menuOpen || !mobileQuery.matches) {
      return;
    }
    lastFocused = document.activeElement;
    menuOpen = true;
    layer.hidden = false;
    toggle.setAttribute('aria-expanded', 'true');
    toggle.setAttribute('aria-label', '关闭菜单');
    document.body.classList.add('menu-open');
    backgroundEls.forEach(function (element) {
      if (element) {
        element.setAttribute('inert', '');
      }
    });
    var firstLink = panel.querySelector('a[href]');
    if (firstLink) {
      firstLink.focus();
    }
  }

  function closeMenu(restoreFocus) {
    if (!layer || !toggle || !menuOpen) {
      return;
    }
    menuOpen = false;
    layer.hidden = true;
    toggle.setAttribute('aria-expanded', 'false');
    toggle.setAttribute('aria-label', '打开菜单');
    document.body.classList.remove('menu-open');
    backgroundEls.forEach(function (element) {
      if (element) {
        element.removeAttribute('inert');
      }
    });
    if (restoreFocus !== false) {
      if (mobileQuery.matches) {
        toggle.focus();
      } else if (lastFocused && typeof lastFocused.focus === 'function') {
        lastFocused.focus();
      }
    }
  }

  if (toggle) {
    toggle.addEventListener('click', function () {
      if (menuOpen) {
        closeMenu(true);
      } else {
        openMenu();
      }
    });
  }

  if (overlay) {
    overlay.addEventListener('click', function () {
      closeMenu(true);
    });
  }

  document.addEventListener('keydown', function (event) {
    if (!menuOpen) {
      return;
    }
    if (event.key === 'Escape') {
      event.preventDefault();
      closeMenu(true);
      return;
    }
    if (event.key === 'Tab') {
      var items = menuFocusables();
      var index = items.indexOf(document.activeElement);
      if (event.shiftKey) {
        if (index <= 0) {
          event.preventDefault();
          items[items.length - 1].focus();
        }
      } else if (index === -1 || index === items.length - 1) {
        event.preventDefault();
        items[0].focus();
      }
    }
  });

  window.addEventListener('resize', function () {
    if (menuOpen && !mobileQuery.matches) {
      closeMenu(false);
    }
  });

  /* ---------- Anchor links: update hash, keep single viewport ---------- */

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target || typeof target.closest !== 'function') {
      return;
    }
    var link = target.closest('a[href^="#"]');
    if (!link) {
      return;
    }
    var href = link.getAttribute('href');
    if (!href || href === '#') {
      return;
    }
    event.preventDefault();
    if (window.location.hash !== href) {
      window.history.pushState(null, '', href);
    }
    if (menuOpen) {
      closeMenu(false);
    }
  });
})();
</script>
</body>
</html>
